name: Release

# Cutting a release is `git tag vX.Y.Z && git push --tags`.
on:
  push:
    tags: ["v*"]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish something that doesn't pass its own tests.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned to a commit on the action's `master` branch, not to the head of
      # its `stable` branch: upstream requires a full-SHA pin to be inside
      # master's history, because commits outside it are garbage-collected and
      # the workflow then fails to resolve. The only thing `stable` adds on top
      # of master is a default for the `toolchain` input, which every step here
      # passes explicitly, so the two behave identically for us. rustup still
      # resolves `stable` at run time, so this freezes the action's code, not
      # the Rust version.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Tag must match the version in Cargo.toml
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="composemux-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stem"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/composemux.exe" "dist/$stem/"
          else
            cp "target/${{ matrix.target }}/release/composemux" "dist/$stem/"
          fi
          cp README.md LICENSE LICENSE-THIRD-PARTY "dist/$stem/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stem.zip" "$stem" >/dev/null
            certutil -hashfile "$stem.zip" SHA256 | sed -n 2p > "$stem.zip.sha256"
          else
            tar czf "$stem.tar.gz" "$stem"
            shasum -a 256 "$stem.tar.gz" > "$stem.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: composemux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  crates-io:
    name: publish to crates.io
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Serialize publishes for a given tag so two runs of the same tag can't both
    # read "not published yet" and race into a double `cargo publish`. Queue
    # rather than cancel: never interrupt a publish already in flight, and let
    # the one that waited fall through to the "already published" skip.
    concurrency:
      group: crates-io-${{ github.ref_name }}
      cancel-in-progress: false
    # Gate on a protected environment so a tag push alone cannot publish.
    environment: release
    permissions:
      # Required for the OIDC exchange; no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
      # Re-running a tag (or re-tagging after the one-time bootstrap publish
      # that a brand-new crate needs, since Trusted Publishing can't do a
      # crate's first upload) must not hard-fail on "crate version already
      # exists". Check the registry first; skip the publish if this exact
      # version is already there, and only mint an OIDC token when we actually
      # intend to publish. crates.io returns 200 for a published version and
      # 404 otherwise; any other status is treated as an error rather than
      # silently skipped or double-published.
      - name: Is this version already on crates.io?
        id: published
        run: |
          name=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: composemux-release (github actions)' \
            "https://crates.io/api/v1/crates/${name}/${version}")
          case "$code" in
            200) echo "${name} ${version} is already published; skipping."; echo "already=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "unexpected HTTP ${code} from crates.io" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
        if: steps.published.outputs.already != 'true'
      - run: cargo publish
        if: steps.published.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew-tap:
    name: update sofired/homebrew-tap
    # Only runs once a GitHub release actually exists for this tag; a tap
    # push is a courtesy update on top of a real release, never a
    # prerequisite for one. Its own job so that a tap-side hiccup (bad
    # token, tap repo unreachable, formula drift) can never hold up the
    # crates.io publish or the GitHub release above.
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Compute new tarball checksum
        id: tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha256=$(curl -fsSL --connect-timeout 10 --max-time 60 "$url" | sha256sum | cut -d' ' -f1)
          {
            echo "version=$version"
            echo "url=$url"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to contents:write on
      # sofired/homebrew-tap only (this repo has no access to that private
      # tap otherwise). It's optional: a fork or a run before the maintainer
      # has provisioned the secret must degrade to a clear skip rather than
      # fail the release, the same way the crates.io and Codecov steps do.
      - name: Update Formula/composemux.rb in the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_URL: ${{ steps.tarball.outputs.url }}
          TAP_SHA256: ${{ steps.tarball.outputs.sha256 }}
          TAP_VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the sofired/homebrew-tap update. Bump Formula/composemux.rb in the tap by hand for this release."
            exit 0
          fi

          workdir=$(mktemp -d)
          git -C "$workdir" clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sofired/homebrew-tap.git" tap
          cd "$workdir/tap"

          formula="Formula/composemux.rb"
          if [ ! -f "$formula" ]; then
            echo "::warning::$formula not found in sofired/homebrew-tap; skipping automated update. Has the formula been committed to the tap yet?"
            exit 0
          fi

          # Only the first `url "..."` / `sha256 "..."` pair is touched (GNU
          # sed's `0,/re/` restricts the match to the first line found), so
          # the stable stanza is rewritten and a `head "...", branch: "main"`
          # line further down is left alone.
          before_url=$(grep -c '^\s*url "' "$formula")
          before_sha=$(grep -c '^\s*sha256 "' "$formula")
          if [ "$before_url" -lt 1 ] || [ "$before_sha" -lt 1 ]; then
            echo "::warning::$formula doesn't look like a source formula (no url/sha256 line); skipping automated update."
            exit 0
          fi
          sed -i -E "0,/^([[:space:]]*)url \"[^\"]*\"/s//\1url \"${TAP_URL}\"/" "$formula"
          sed -i -E "0,/^([[:space:]]*)sha256 \"[^\"]*\"/s//\1sha256 \"${TAP_SHA256}\"/" "$formula"

          if git diff --quiet; then
            echo "::notice::sofired/homebrew-tap already has this url/sha256; nothing to commit."
            exit 0
          fi

          git config user.name "composemux-release"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "composemux ${TAP_VERSION}"
          git push
