name: Release

# Cutting a release is `git tag vX.Y.Z && git push --tags`.
on:
  push:
    tags: ["v*"]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish something that doesn't pass its own tests.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned to a commit on the action's `master` branch, not to the head of
      # its `stable` branch: upstream requires a full-SHA pin to be inside
      # master's history, because commits outside it are garbage-collected and
      # the workflow then fails to resolve. The only thing `stable` adds on top
      # of master is a default for the `toolchain` input, which every step here
      # passes explicitly, so the two behave identically for us. rustup still
      # resolves `stable` at run time, so this freezes the action's code, not
      # the Rust version.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Tag must match the version in Cargo.toml
        run: |
          crate_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - name: Rehearse the Homebrew formula's install and test
        # Mirrors the sofired/homebrew-tap formula exactly: its `std_cargo_args`
        # installs with `--locked`, and its `test do` asserts on `composemux
        # --version` output. Running the same two steps here catches a
        # `--version` format change or lockfile drift before the tag is
        # published, rather than the tap's test-bot going red after the
        # formula is already live.
        run: |
          cargo install --locked --path . --root "$RUNNER_TEMP/brewcheck"
          "$RUNNER_TEMP/brewcheck/bin/composemux" --version | grep -qF "composemux ${GITHUB_REF_NAME#v}"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="composemux-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stem"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/composemux.exe" "dist/$stem/"
          else
            cp "target/${{ matrix.target }}/release/composemux" "dist/$stem/"
          fi
          cp README.md LICENSE LICENSE-THIRD-PARTY "dist/$stem/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stem.zip" "$stem" >/dev/null
            certutil -hashfile "$stem.zip" SHA256 | sed -n 2p > "$stem.zip.sha256"
          else
            tar czf "$stem.tar.gz" "$stem"
            shasum -a 256 "$stem.tar.gz" > "$stem.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: composemux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  crates-io:
    name: publish to crates.io
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Serialize publishes for a given tag so two runs of the same tag can't both
    # read "not published yet" and race into a double `cargo publish`. Queue
    # rather than cancel: never interrupt a publish already in flight, and let
    # the one that waited fall through to the "already published" skip.
    concurrency:
      group: crates-io-${{ github.ref_name }}
      cancel-in-progress: false
    # Gate on a protected environment so a tag push alone cannot publish.
    environment: release
    permissions:
      # Required for the OIDC exchange; no long-lived token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
      # Re-running a tag (or re-tagging after the one-time bootstrap publish
      # that a brand-new crate needs, since Trusted Publishing can't do a
      # crate's first upload) must not hard-fail on "crate version already
      # exists". Check the registry first; skip the publish if this exact
      # version is already there, and only mint an OIDC token when we actually
      # intend to publish. crates.io returns 200 for a published version and
      # 404 otherwise; any other status is treated as an error rather than
      # silently skipped or double-published.
      - name: Is this version already on crates.io?
        id: published
        run: |
          name=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: composemux-release (github actions)' \
            "https://crates.io/api/v1/crates/${name}/${version}")
          case "$code" in
            200) echo "${name} ${version} is already published; skipping."; echo "already=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "unexpected HTTP ${code} from crates.io" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
        if: steps.published.outputs.already != 'true'
      - run: cargo publish --locked
        if: steps.published.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew-tap:
    name: update sofired/homebrew-tap
    # Its own job so a tap-side hiccup (bad token, tap unreachable, formula
    # drift) can never hold up the crates.io publish or the GitHub release.
    needs: github-release
    # Same protected environment as the crates.io publish: a tag push alone must
    # not be able to push a formula that `brew install` users then execute.
    environment: release
    # A single constant group serializes ALL tap updates, not just same-tag
    # ones: every release tag pushes the same tap branch, so two different tags
    # racing here would hit a non-fast-forward push or clobber each other's
    # formula. (crates-io keys by tag because each tag is a distinct version.)
    concurrency:
      group: homebrew-tap-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Three bottle builds on the tap plus its publish run; waiting is the bulk.
    timeout-minutes: 90
    steps:
      # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to sofired/homebrew-tap
      # only, provisioned on the `release` environment, with contents:write
      # (push the bump branch), pull-requests:write (open the PR) and
      # actions:write (dispatch the tap's publish workflow). It
      # is optional: a run before the maintainer provisions it degrades to a
      # clear skip rather than failing the release (as the crates.io and Codecov
      # steps do). Every other step is gated on this, so an unconfigured repo
      # does no wasted work.
      - name: Does the tap have a token?
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update. Bump Formula/composemux.rb in the tap by hand for this release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # The tag is attacker-influenceable (anyone who can push a tag), and its
      # derived values get written into a Ruby file Homebrew executes on every
      # user's machine. Validate them here (strict semver, 64-hex digest) and
      # refuse otherwise; this is the injection defense, not the verify job.
      - name: Validate the tag and compute the tarball checksum
        id: meta
        if: steps.gate.outputs.enabled == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "refusing to update the tap: '$version' is not a semver version" >&2
            exit 1
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL --connect-timeout 10 --max-time 60 "$url" | sha256sum | cut -d' ' -f1)
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "refusing to update the tap: computed sha256 '$sha' is malformed" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "url=$url"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      # actions/checkout stores the token as an http.extraheader that it scrubs
      # in its post step, rather than us baking it into a remote URL that would
      # persist in .git/config. It is the pinned, allow-listed action this repo
      # already uses.
      - name: Check out the tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sofired/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Formula/composemux.rb on a branch
        id: bump
        if: steps.gate.outputs.enabled == 'true'
        env:
          F_URL: ${{ steps.meta.outputs.url }}
          F_SHA256: ${{ steps.meta.outputs.sha256 }}
          F_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          formula="tap/Formula/composemux.rb"
          if [ ! -f "$formula" ]; then
            echo "::warning::$formula not found in the tap; has the formula been committed yet? Skipping."
            exit 0
          fi
          # Rewrite only the first stable url/sha256 pair, via python with literal
          # replacements read from the environment (no sed delimiter hazard, no
          # untrusted data spliced into a program). The head stanza is a `head`
          # line, not a `url` line, so it is untouched.
          python3 <<'PY'
          import os, re, sys
          path = "tap/Formula/composemux.rb"
          url, sha = os.environ["F_URL"], os.environ["F_SHA256"]
          text = open(path).read()
          text, n_url = re.subn(r'^(\s*)url "[^"]*"',
                                lambda m: m.group(1) + 'url "' + url + '"',
                                text, count=1, flags=re.M)
          text, n_sha = re.subn(r'^(\s*)sha256 "[^"]*"',
                                lambda m: m.group(1) + 'sha256 "' + sha + '"',
                                text, count=1, flags=re.M)
          if (n_url, n_sha) != (1, 1):
              sys.exit("expected exactly one url and one sha256 stanza (got url=%d, sha256=%d)" % (n_url, n_sha))
          open(path, "w").write(text)
          PY
          # Post-conditions: the new values landed on the first stanza.
          grep -qF "url \"$F_URL\"" "$formula"
          grep -qF "sha256 \"$F_SHA256\"" "$formula"
          cd tap
          if git diff --quiet; then
            echo "::notice::the tap already has this url/sha256; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A branch, not main: the tap bottles a formula on its PR CI, and
          # `brew pr-pull` lands the bump together with the bottle block.
          git checkout -q -b "composemux-${F_VERSION}"
          git -c user.name="composemux-release" \
              -c user.email="actions@users.noreply.github.com" \
              commit -am "composemux ${F_VERSION}"
          git push origin "HEAD:refs/heads/composemux-${F_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The tap's tests.yml builds and tests the bumped formula on every bottle
      # platform and stores the bottles as artifacts; its publish.yml (`brew
      # pr-pull`) then uploads them to the tap's `bottles` release and pushes
      # the bump plus the `bottle do` block to main. This step opens the PR,
      # waits for its checks, and dispatches that workflow. A failure here
      # leaves the PR open for a maintainer; the crates.io publish and the
      # GitHub release are already done by then.
      - name: Open the tap pull request, wait for its bottles, and publish them
        if: steps.gate.outputs.enabled == 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          F_VERSION: ${{ steps.meta.outputs.version }}
          TAP: sofired/homebrew-tap
        run: |
          set -euo pipefail
          cd tap
          head_sha=$(git rev-parse HEAD)
          pr_url=$(gh pr create --repo "$TAP" --base main \
            --head "composemux-${F_VERSION}" \
            --title "composemux ${F_VERSION}" \
            --body "Version bump from the composemux ${GITHUB_REF_NAME} release. This PR's checks build the bottles; the brew pr-pull workflow publishes them and lands the bump.")
          pr_number="${pr_url##*/}"
          echo "::notice::opened ${pr_url}"
          # Checks register a few seconds after the PR opens, and `gh pr checks`
          # errors until they do (exit 8 means they exist and are pending).
          for _ in $(seq 1 18); do
            gh pr checks "$pr_number" --repo "$TAP" >/dev/null 2>&1 && break
            [ "$?" -eq 8 ] && break
            sleep 10
          done
          gh pr checks "$pr_number" --repo "$TAP" --watch --fail-fast
          gh workflow run publish.yml --repo "$TAP" \
            -f pull_request="$pr_number" -f head_sha="$head_sha"
          echo "::notice::bottles for composemux ${F_VERSION} are being published from ${pr_url}"
