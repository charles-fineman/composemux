name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo. Jobs needing more should
# opt in individually rather than widening this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned to a commit on the action's `master` branch, not to the head of
      # its `stable` branch: upstream requires a full-SHA pin to be inside
      # master's history, because commits outside it are garbage-collected and
      # the workflow then fails to resolve. The only thing `stable` adds on top
      # of master is a default for the `toolchain` input, which every step here
      # passes explicitly, so the two behave identically for us. rustup still
      # resolves `stable` at run time, so this freezes the action's code, not
      # the Rust version.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The clipboard fallback is optional; make sure it still builds without it.
      - run: cargo build --no-default-features

  release-build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: composemux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/composemux

  publish-check:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
      - run: cargo publish --dry-run

  coverage:
    name: coverage
    # A separate job, deliberately: a Codecov outage or a bad token must never
    # block the test/build gates above. This job's own failure is soft (see
    # fail_ci_if_error below) for the same reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master, 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # taiki-e/install-action fetches a prebuilt cargo-llvm-cov binary instead
      # of compiling it, which is the same "install a CI tool" idiom this repo
      # would otherwise reach for `cargo install --locked` for, just faster.
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      # No token: sofired has Codecov's "require token for public repos"
      # setting turned off, so uploads for this public repo are tokenless
      # (v5+). Fork PRs upload tokenless regardless.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
